<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="100%" height="100%">
  <defs>
    <!-- Phông nền phòng chụp thể thao studio ánh sáng sân cỏ -->
    <radialGradient id="playerStudioBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8F1FC"/>
      <stop offset="50%" stop-color="#C5D7EC"/>
      <stop offset="100%" stop-color="#8EA8C8"/>
    </radialGradient>

    <!-- Màu da thể thao nam tính rắn rỏi -->
    <linearGradient id="proSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0B094"/>
      <stop offset="60%" stop-color="#CD987A"/>
      <stop offset="100%" stop-color="#B27B5E"/>
    </linearGradient>

    <!-- Đổ bóng cơ cổ & xương quai xanh vận động viên -->
    <linearGradient id="proNeck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E684D"/>
      <stop offset="100%" stop-color="#B57F63"/>
    </linearGradient>

    <!-- Áo đấu trắng thể thao với khối cơ ngực bóng đá -->
    <linearGradient id="proJersey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#D1DCEB"/>
    </linearGradient>

    <!-- Tóc nam thể thao vuốt undercut năng động -->
    <linearGradient id="proHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3136"/>
      <stop offset="100%" stop-color="#121416"/>
    </linearGradient>

    <!-- Họa tiết tổ ong/lục giác áo đấu bóng đá hiện đại -->
    <pattern id="hexPattern" width="24" height="20.78" patternUnits="userSpaceOnUse">
      <path d="M 12,0 L 24,6.93 L 24,13.86 L 12,20.78 L 0,13.86 L 0,6.93 Z" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Nền thẻ ảnh 4:5 -->
  <rect width="480" height="600" fill="url(#playerStudioBg)"/>

  <!-- Vầng hào quang spotlight sau lưng cầu thủ -->
  <circle cx="240" cy="240" r="170" fill="#FFFFFF" opacity="0.45" filter="blur(20px)"/>

  <!-- Nhóm nhân vật cầu thủ bóng đá chuẩn tỉ lệ thể hình -->
  <g>
    <!-- Cơ vai và lồng ngực vạm vỡ của cầu thủ -->
    <!-- Bóng đổ vai -->
    <path d="M 30,600 C 45,445 105,395 180,375 L 300,375 C 375,395 435,445 450,600 Z" fill="rgba(0,0,0,0.12)"/>

    <!-- Áo đấu bóng đá (Pro Football Jersey) -->
    <path d="M 35,600 C 50,440 110,390 185,370 L 295,370 C 370,390 430,440 445,600 Z" fill="url(#proJersey)"/>

    <!-- Phủ vân lục giác thể thao công nghệ cao -->
    <path d="M 35,600 C 50,440 110,390 185,370 L 295,370 C 370,390 430,440 445,600 Z" fill="url(#hexPattern)"/>

    <!-- Dải sườn áo thoáng khí năng động hai bên mạn sườn (Ventilation panels) -->
    <path d="M 60,600 C 72,480 115,430 155,405 L 140,600 Z" fill="#0A3CC0" opacity="0.85"/>
    <path d="M 420,600 C 408,480 365,430 325,405 L 340,600 Z" fill="#0A3CC0" opacity="0.85"/>

    <!-- Vạch viền kim loại / vàng đồng thể thao trên vai áo -->
    <path d="M 115,420 C 138,400 162,388 185,380 L 188,390 C 166,397 144,408 122,427 Z" fill="#FFE259"/>
    <path d="M 365,420 C 342,400 318,388 295,380 L 292,390 C 314,397 336,408 358,427 Z" fill="#FFE259"/>

    <!-- Cổ áo bóng đá V-neck khí động học -->
    <path d="M 190,370 L 240,425 L 290,370 L 270,370 L 240,405 L 210,370 Z" fill="#0A3CC0"/>
    <path d="M 210,370 L 240,405 L 225,405 L 202,370 Z" fill="#FFE259"/>

    <!-- Cơ cổ vạm vỡ, góc cạnh vận động viên -->
    <path d="M 205,290 L 205,375 L 240,412 L 275,375 L 275,290 Z" fill="url(#proSkin)"/>
    <!-- Khối hõm cổ & yết hầu thể thao -->
    <polygon points="205,290 240,350 275,290" fill="url(#proNeck)"/>
    <path d="M 228,340 L 240,355 L 252,340" stroke="#7A442E" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Gương mặt nam tính góc cạnh (Strong Athletic Jawline) -->
    <path d="M 172,210 C 172,135 190,115 240,115 C 290,115 308,135 308,210 C 308,268 280,305 240,305 C 200,305 172,268 172,210 Z" fill="url(#proSkin)"/>

    <!-- Tai thể thao -->
    <path d="M 166,200 C 160,190 160,225 172,230 Z" fill="#B27B5E"/>
    <path d="M 314,200 C 320,190 320,225 308,230 Z" fill="#B27B5E"/>

    <!-- Tóc undercut thể thao hiện đại, vuốt phồng sắc sảo -->
    <path d="M 166,195 C 164,125 190,92 240,92 C 290,92 316,125 314,195 C 304,145 285,130 240,130 C 195,130 176,145 166,195 Z" fill="url(#proHair)"/>
    <!-- Mảng tóc tỉa fade hai bên mang tai -->
    <path d="M 168,185 C 172,160 185,145 200,138 L 196,155 C 185,160 174,170 168,185 Z" fill="#4B5563"/>
    <path d="M 312,185 C 308,160 295,145 280,138 L 284,155 C 295,160 306,170 312,185 Z" fill="#4B5563"/>

    <!-- Logo CLB thu nhỏ trước ngực áo trái -->
    <g transform="translate(175, 430) scale(0.22)">
      <circle cx="60" cy="60" r="52" fill="#0A3CC0" stroke="#FFE259" stroke-width="5"/>
      <circle cx="60" cy="60" r="38" fill="#1E50C8"/>
      <text x="60" y="68" text-anchor="middle" fill="#FFFFFF" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="22" font-weight="900">17A</text>
      <!-- Ngôi sao vô địch nhỏ trên đỉnh logo ngực -->
      <polygon points="60,0 63,7 70,7 64,11 67,18 60,14 53,18 56,11 50,7 57,7" fill="#FFE259"/>
    </g>

    <!-- Biểu tượng giải đấu / huy hiệu tay áo bên phải ngực -->
    <g transform="translate(285, 436) scale(0.18)" opacity="0.85">
      <circle cx="40" cy="40" r="35" fill="none" stroke="#0A3CC0" stroke-width="6"/>
      <path d="M 40,15 L 45,30 L 60,30 L 48,40 L 52,55 L 40,45 L 28,55 L 32,40 L 20,30 L 35,30 Z" fill="#0A3CC0"/>
    </g>

    <!-- Đường may định hình cơ bụng thể thao -->
    <path d="M 240,430 L 240,580" stroke="#CBD5E1" stroke-width="2" opacity="0.7"/>
    <path d="M 210,480 Q 240,490 270,480" stroke="#CBD5E1" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
</svg>
