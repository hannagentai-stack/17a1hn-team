<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="100%" height="100%">
  <defs>
    <!-- Phông nền phòng chụp studio -->
    <radialGradient id="staffStudioBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8F1FC"/>
      <stop offset="50%" stop-color="#C5D7EC"/>
      <stop offset="100%" stop-color="#8EA8C8"/>
    </radialGradient>

    <!-- Màu da trung tính chín chắn -->
    <linearGradient id="proStaffSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEB095"/>
      <stop offset="60%" stop-color="#CB977B"/>
      <stop offset="100%" stop-color="#B17A5E"/>
    </linearGradient>

    <!-- Áo Polo ban huấn luyện bóng đá cao cấp -->
    <linearGradient id="proPolo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4EC6"/>
      <stop offset="60%" stop-color="#0F389E"/>
      <stop offset="100%" stop-color="#08236B"/>
    </linearGradient>

    <!-- Tóc người chỉ huy chiến thuật đứng đắn -->
    <linearGradient id="proStaffHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F3935"/>
      <stop offset="100%" stop-color="#1C1816"/>
    </linearGradient>
  </defs>

  <!-- Nền thẻ ảnh 4:5 -->
  <rect width="480" height="600" fill="url(#staffStudioBg)"/>

  <!-- Spotlight sau lưng HLV -->
  <circle cx="240" cy="240" r="170" fill="#FFFFFF" opacity="0.4" filter="blur(20px)"/>

  <!-- Nhóm nhân vật Ban huấn luyện bóng đá -->
  <g>
    <!-- Thân & Áo Polo HLV bóng đá phong cách Châu Âu -->
    <path d="M 35,600 C 50,440 110,390 185,370 L 295,370 C 370,390 430,440 445,600 Z" fill="url(#proPolo)"/>

    <!-- Đổ bóng khối sườn áo -->
    <path d="M 35,600 C 52,480 100,425 150,400 L 135,600 Z" fill="#061B52" opacity="0.6"/>
    <path d="M 445,600 C 428,480 380,425 330,400 L 345,600 Z" fill="#04133A" opacity="0.6"/>

    <!-- Cổ HLV -->
    <path d="M 205,290 L 205,375 L 240,405 L 275,375 L 275,290 Z" fill="url(#proStaffSkin)"/>
    <polygon points="205,290 240,345 275,290" fill="#99634B"/>

    <!-- Gương mặt điềm đạm, quyết đoán -->
    <path d="M 172,210 C 172,135 190,115 240,115 C 290,115 308,135 308,210 C 308,268 280,305 240,305 C 200,305 172,268 172,210 Z" fill="url(#proStaffSkin)"/>

    <!-- Tai -->
    <path d="M 166,200 C 160,190 160,225 172,230 Z" fill="#B17A5E"/>
    <path d="M 314,200 C 320,190 320,225 308,230 Z" fill="#B17A5E"/>

    <!-- Tóc rẽ ngôi 7/3 lịch lãm -->
    <path d="M 166,195 C 164,125 190,95 240,95 C 290,95 316,125 314,195 C 304,145 285,128 240,128 C 195,128 176,145 166,195 Z" fill="url(#proStaffHair)"/>

    <!-- Cổ áo Polo bẻ gập viền sọc trắng thể thao -->
    <path d="M 215,370 L 240,392 L 205,445 L 172,385 Z" fill="#FFFFFF" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.3))"/>
    <path d="M 213,374 L 235,392 L 206,438 L 178,387 Z" fill="#0F389E"/>

    <path d="M 265,370 L 240,392 L 275,445 L 308,385 Z" fill="#FFFFFF" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.3))"/>
    <path d="M 267,374 L 245,392 L 274,438 L 302,387 Z" fill="#0C2F85"/>

    <!-- Nẹp cúc áo Polo -->
    <path d="M 230,392 L 250,392 L 250,490 L 230,490 Z" fill="#09246B" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="240" cy="418" r="3.5" fill="#FFFFFF"/>
    <circle cx="240" cy="445" r="3.5" fill="#FFFFFF"/>
    <circle cx="240" cy="472" r="3.5" fill="#FFFFFF"/>

    <!-- Huy hiệu HLV bóng đá thêu ngực áo trái -->
    <g transform="translate(165, 435) scale(0.22)">
      <circle cx="60" cy="60" r="52" fill="#FFFFFF" stroke="#FFE259" stroke-width="5"/>
      <circle cx="60" cy="60" r="38" fill="#0A3CC0"/>
      <text x="60" y="68" text-anchor="middle" fill="#FFFFFF" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="20" font-weight="900">HLV</text>
    </g>
  </g>
</svg>
